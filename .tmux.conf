# Set Powerline config environment variable if missing
if-shell 'test -z "$POWERLINE_CONFIG_COMMAND"' 'set-environment -g POWERLINE_CONFIG_COMMAND powerline-config'

# Setup Powerline configuration
if-shell 'env "$POWERLINE_CONFIG_COMMAND" tmux setup' '' 'run-shell "powerline-config tmux setup"'
# Powerline sets status-interval 2; refresh every 5s instead to cut its periodic CPU cost
set -g status-interval 5

# Tmux Plugin Manager settings
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @sidebar_notifications off
# Don't open the sidebar in every new window; prefix+E controls it (see the bottom of this file)
set -g @sidebar_auto_create off
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Save custom window colors and generate restore script
set -g @resurrect-hook-post-save-all 'tmux list-windows -a -F "#{session_name}:#{window_index} #{@mycolor}" | grep -v " $" > ~/.tmux/window-colors.txt; ls -t ~/.local/share/tmux/resurrect/tmux_resurrect_*.txt | tail -n +6 | xargs rm -f'

# Restore: session + colors
set -g @resurrect-hook-post-restore-all 'while read target color; do tmux set-window-option -t "$target" @mycolor "$color"; tmux set-window-option -t "$target" window-status-format "#[fg=colour233,bg=${color},nobold,noitalics,nounderscore] #{E:@agent_dot}#[fg=colour233,bg=${color},nobold,noitalics,nounderscore]#I#{?window_flags,#F, }  #[fg=colour233,bg=${color},nobold,noitalics,nounderscore]#W #[fg=${color},bg=colour233,nobold,noitalics,nounderscore] "; done < ~/.tmux/window-colors.txt'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"
set -ga terminal-overrides ",*256color*:Tc"

# Optimization for Neovim/Vim (Enable focus events and remove ESC key delay)
set-option -g focus-events on
set -sg escape-time 0

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# UI Color Settings (Message bar and Pane borders)
set-option -g message-style "fg=#ffffff,bg=#5c62d6,fill=#5c62d6"
set-option -g message-command-style "fg=#ffffff,bg=#5c62d6,fill=#5c62d6"
set -g prompt-cursor-colour "#ffffff"
set-option -g mode-style bg=blue,fg=#ffffff
set -g pane-active-border-style fg=dodgerblue
set -g pane-border-style fg=#808080

# Enable mouse support (Click to select pane/window, resize panes)
set -g mouse on

# Increase scrollback history limit
set -g history-limit 100000

# Use Vi key bindings in copy mode
setw -g mode-keys vi

# Swap window order using Left/Right keys
bind-key -r Left swap-window -t -1\; select-window -t -1
bind-key -r Right swap-window -t +1\; select-window -t +1

# bind-key -n C-M-k select-pane -U
# bind-key -n C-M-j select-pane -D
# bind-key -n C-M-h select-pane -L
# bind-key -n C-M-l select-pane -R

# Resize panes with vim-style keys (uppercase to avoid conflict with commented-out lowercase pane-nav bindings)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Switch windows directly using Alt + Number
# [iTerm2 Config Required] Settings > Profiles > Keys > General > Set 'Left Option Key' to 'Esc+'
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
# Bind Alt + 9 to select the last window (Chrome-style)
bind -n M-9 select-window -t :$

# Automatically renumber windows when one is closed
set-option -g renumber-windows on

# Navigate previous/next windows using Ctrl + Shift + Arrow keys
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window

# Navigate previous/next windows using Option + h/l keys
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Navigate panes using Vim keys (Prefix + h/j/k/l)
# bind -r k select-pane -U
# bind -r j select-pane -D
# bind -r h select-pane -L
# bind -r l select-pane -R

# Bind 'a' to set custom background color for inactive windows
bind a command-prompt -e -p "Window Color:" \
  "set -w @mycolor '%%'; \
   set-window-option window-status-format '#[fg=colour233,bg=#{@mycolor},nobold,noitalics,nounderscore] #{E:@agent_dot}#[fg=colour233,bg=#{@mycolor},nobold,noitalics,nounderscore]#I#{?window_flags,#F, }  #[fg=colour233,bg=#{@mycolor},nobold,noitalics,nounderscore]#W #[fg=#{@mycolor},bg=colour233,nobold,noitalics,nounderscore] '"

# Bind 'A' to reset custom colors and revert to default settings
bind A "set -w -u @mycolor; set-window-option -u window-status-current-format; set-window-option -u window-status-format"

# Force resize window to fit current client (fixes rendering glitches after restore)
bind R resize-window -A

# Claude Code agent status dot (merges tmux-agent-sidebar's @pane_status / @pane_subagents and @pane_phase per window).
# Pure tmux formats, so no process is spawned per window on each status refresh.
# Priority (high -> low): error (red ✕) > waiting (purple ?) > idle/background (green ●)
#   > subagent (teal ●) > executing (blue ●) > thinking (orange ●) > compacting (grey ●)
# background = turn ended with a bg shell left; the plugin only clears it while a sidebar is open, so it counts as idle.
# One letter per agent pane: E error, W waiting, I idle, S subagent, X executing, T thinking, C compacting
set -g @agent_codes '#{P:#{?#{==:#{@pane_status},error},E,#{?#{==:#{@pane_status},waiting},W,#{?#{m/r:^(idle|background)$,#{@pane_status}},I,#{?#{==:#{@pane_status},running},#{?@pane_subagents,S,#{?#{==:#{@pane_phase},executing},X,#{?#{==:#{@pane_phase},compacting},C,T}}},}}}}}'
# Highest-priority letter in the window (empty = no agent, no mark)
set -g @agent_state '#{?#{m:*E*,#{E:@agent_codes}},E,#{?#{m:*W*,#{E:@agent_codes}},W,#{?#{m:*I*,#{E:@agent_codes}},I,#{?#{m:*S*,#{E:@agent_codes}},S,#{?#{m:*X*,#{E:@agent_codes}},X,#{?#{m:*T*,#{E:@agent_codes}},T,#{?#{m:*C*,#{E:@agent_codes}},C,}}}}}}}'
# Colour the tab is painted with (active tab / per-window @mycolor / default)
set -g @agent_tabbg '#{?window_active,colour31,#{?@mycolor,#{@mycolor},colour233}}'
# State colour, or the tab text colour (colour233) when it is in the same family as the tab colour
set -g @agent_fg '#{?#{==:#{E:@agent_state},E},#{?#{m/ri:^(red|brightred|colour1|colour9|colour160|colour196|.ff0000)$,#{E:@agent_tabbg}},colour233,colour196},#{?#{==:#{E:@agent_state},W},#{?#{m/r:^(purple|magenta|brightmagenta|colour5|colour13|colour129|colour135|colour141)$,#{E:@agent_tabbg}},colour233,colour141},#{?#{==:#{E:@agent_state},I},#{?#{m/ri:^(green|brightgreen|colour2|colour10|colour46|.00ff00)$,#{E:@agent_tabbg}},colour233,colour46},#{?#{==:#{E:@agent_state},S},#{?#{m/r:^(cyan|brightcyan|colour6|colour14|colour44)$,#{E:@agent_tabbg}},colour233,colour44},#{?#{==:#{E:@agent_state},X},#{?#{m/ri:^(blue|brightblue|skyblue|colour4|colour12|colour27|colour31|colour33|.0064ff)$,#{E:@agent_tabbg}},colour233,colour33},#{?#{==:#{E:@agent_state},T},#{?#{m/r:^(orange|colour202|colour208|colour214)$,#{E:@agent_tabbg}},colour233,colour208},#{?#{m/r:^(grey|gray|colour8|colour244|colour245)$,#{E:@agent_tabbg}},colour233,colour245}}}}}}}'
# The mark itself; only the glyph colour is set, the tab format paints the background
set -g @agent_dot '#{?#{E:@agent_state},#[fg=#{E:@agent_fg}]#[bold]#{?#{==:#{E:@agent_state},E},✕,#{?#{==:#{E:@agent_state},W},?,●}}#[nobold] ,}'

# Powerline's default inactive tab format (expanded from powerline-base.conf) with the agent dot prepended
set-window-option -g window-status-format '#[fg=colour244,bg=colour233,nobold,noitalics,nounderscore]  #{E:@agent_dot}#[fg=colour244,bg=colour233]#I#{?window_flags,#F, } #[fg=colour240,bg=colour233,nobold,noitalics,nounderscore] #[default]#W   '

# Active tab end caps (rounded) so it stands out from colour-customised tabs.
# Try other shapes at runtime with ~/.tmux/scripts/active-tab-shape.sh <preset>
set -g @active_cap_l ''
set -g @active_cap_r ''
set -g @active_cap_l_style 'fg=colour31,bg=colour233'

# Set global active window style (Blue bg) with a Red * flag
set-window-option -g window-status-current-format '#[#{@active_cap_l_style},nobold,noitalics,nounderscore]#{@active_cap_l}#[fg=colour117,bg=colour31] #{E:@agent_dot}#[fg=colour117,bg=colour31,nobold,noitalics,nounderscore]#I#[fg=red]#F#[fg=colour117]  #[fg=colour231,bg=colour31,bold,noitalics,nounderscore]#W #[fg=colour31,bg=colour233,nobold,noitalics,nounderscore]#{@active_cap_r}#[fg=colour31,bg=colour233] '

# Allow tmux to pass through image graphic signals from Ghostty/Kitty
set -gq allow-passthrough on

# Enable automatic refresh to prevent leftover image artifacts when switching panes/windows
set -g visual-activity off

# sesh: prefix + T 로 세션 검색/전환
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^x zoxide' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# 세션 닫아도 tmux에서 튕기지 않고 다른 세션으로 이동
set -g detach-on-destroy off

# 팝업 배경/테두리 색 지정 (sesh, floax 같은 팝업 전부 적용)
set -g popup-style "bg=#000000"
set -g popup-border-style "fg=dodgerblue"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmux-agent-sidebar: prefix+E toggles sidebars in all windows and remembers it (@sidebar_all),
# so new windows get a sidebar only while that mode is on.
# Kept after tpm so it overrides the plugin's default E binding.
bind E run-shell '~/.tmux/scripts/sidebar-all.sh toggle'
set-hook -g after-new-window[90] 'run-shell "~/.tmux/scripts/sidebar-all.sh new-window #{window_id} \"#{pane_current_path}\""'
